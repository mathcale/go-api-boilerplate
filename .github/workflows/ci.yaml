name: Continuous Integration

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Test
      shell: bash
      run: ./scripts/test.sh --no-open
