name: Continuous Integration

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

env:
  COVERAGE_THRESHOLD: 90

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Test
      shell: bash
      run: ./scripts/test.sh --no-open --keep

    - name: Coverage summary
      id: coverage
      shell: bash
      run: |
        total=$(go tool cover -func=coverage.tmp | awk '/^total:/ {print $NF}')
        echo "total=$total" >> "$GITHUB_OUTPUT"
        if awk -v t="${total%\%}" -v min="$COVERAGE_THRESHOLD" 'BEGIN { exit !(t+0 >= min) }'; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.html

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: coverage
        message: |
          ### Code coverage: **${{ steps.coverage.outputs.total }}** ${{ steps.coverage.outputs.passed == 'true' && '✅' || '❌' }}
          Threshold: ${{ env.COVERAGE_THRESHOLD }}%. The full HTML report is in this run's artifacts.

    - name: Enforce coverage threshold
      if: steps.coverage.outputs.passed != 'true'
      run: |
        echo "Coverage ${{ steps.coverage.outputs.total }} is below ${COVERAGE_THRESHOLD}%"
        exit 1
