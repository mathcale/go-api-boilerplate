definitions:
  apperror.BusinessCode:
    enum:
    - E100
    - E101
    - E102
    - E103
    - E104
    - E105
    type: string
    x-enum-varnames:
    - BUSINESS_E100
    - BUSINESS_E101
    - BUSINESS_E102
    - BUSINESS_E103
    - BUSINESS_E104
    - BUSINESS_E105
  dto.CounterOutput:
    properties:
      counter:
        type: integer
    type: object
  dto.ErrorOutput:
    properties:
      code:
        $ref: '#/definitions/apperror.BusinessCode'
      message:
        type: string
    type: object
  dto.SignInInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.SignInOutput:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.SignUpInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
externalDocs:
  description: OpenAPI v2
  url: https://swagger.io/specification/v2/
info:
  contact: {}
  description: A slightly opinionated HTTP API boilerplate with the Go programming
    language.
  license:
    name: MIT License
    url: https://github.com/mathcale/go-api-boilerplate/blob/main/LICENSE
  title: go-api-boilerplate
  version: "1.0"
paths:
  /v1/auth/signin:
    post:
      consumes:
      - application/json
      description: Sign in and retrieve JWT token
      parameters:
      - description: Params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignInInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SignInOutput'
        "400":
          description: Body parsing failed
          schema:
            $ref: '#/definitions/dto.ErrorOutput'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/dto.ErrorOutput'
        "422":
          description: Request validation error
          schema:
            $ref: '#/definitions/dto.ErrorOutput'
        "500":
          description: Business/internal error
          schema:
            $ref: '#/definitions/dto.ErrorOutput'
      summary: Sign in
      tags:
      - auth
  /v1/auth/signup:
    post:
      consumes:
      - application/json
      description: Creates new user
      parameters:
      - description: Params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignUpInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Body parsing failed
          schema:
            $ref: '#/definitions/dto.ErrorOutput'
        "408":
          description: User already exists
          schema:
            $ref: '#/definitions/dto.ErrorOutput'
        "422":
          description: Request validation error
          schema:
            $ref: '#/definitions/dto.ErrorOutput'
        "500":
          description: Business/internal error
          schema:
            $ref: '#/definitions/dto.ErrorOutput'
      summary: Sign up
      tags:
      - auth
  /v1/counter:
    get:
      description: Increments an in-memory counter up to a limit value
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CounterOutput'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorOutput'
      summary: Increments an in-memory counter
      tags:
      - counter
swagger: "2.0"
