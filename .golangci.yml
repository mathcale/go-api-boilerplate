version: "2"

run:
  go: "1.27"
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck     # Check for unchecked errors
    - govet        # Standard Go vet
    - staticcheck  # Advanced static analysis (includes gosimple, stylecheck)
    - gosec        # Security audit
    - ineffassign  # Detect ineffectual assignments
    - unused       # Find unused code
    - gocyclo      # Cyclomatic complexity
    - funlen       # Function length
    - lll          # Line length limit
    - goconst      # Find repeated strings that could be constants
    - misspell     # Find misspelled words
    - unconvert    # Remove unnecessary type conversions
    - unparam      # Find unused function parameters
    - testifylint  # Testify linter

  disable:
    - err113
    - exhaustruct

  settings:
    lll:
      line-length: 100

    funlen:
      lines: 80
      statements: 50

    gocyclo:
      min-complexity: 15

    govet:
      enable-all: true
      disable:
        - fieldalignment

    gosec:
      excludes:
        - G104

    testifylint:
      enable-all: true
      disable:
        - suite-dont-use-pkg

  exclusions:
    generated: strict
    rules:
      - path: '(.+)_test\.go'
        linters:
          - funlen
          - gocyclo
          - goconst
          - lll

      - path: '(.+)_test\.go'
        text: "Use of weak random number generator"
        linters:
          - gosec

      - path: 'cmd/api/main.go'
        linters:
          - funlen

      - path: 'migrations/'
        linters:
          - lll

      - path: 'internal/infra/gateways/(.+)/repository\.go'
        linters:
          - lll
          - gosec

    paths:
      - "docs/"
      - "tmp/"
      - "vendor/"

formatters:
  enable:
    - gci       # Import ordering
    - gofmt     # Standard formatting
    - goimports # Import management

  settings:
    gci:
      sections:
        - standard                                         # Standard library packages
        - default                                          # Third-party packages
        - prefix(github.com/mathcale/go-api-boilerplate)   # Your project packages

output:
  formats:
    text:
      path: stdout
