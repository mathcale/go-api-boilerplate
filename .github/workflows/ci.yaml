name: Continuous Integration

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write

env:
  COVERAGE_THRESHOLD: 90

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.27'

    - name: Test
      shell: bash
      run: ./scripts/test.sh --no-open --keep

    - name: Coverage summary
      id: coverage
      shell: bash
      run: |
        total=$(go tool cover -func=coverage.tmp | awk '/^total:/ {print $NF}')
        echo "total=$total" >> "$GITHUB_OUTPUT"
        if awk -v t="${total%\%}" -v min="$COVERAGE_THRESHOLD" 'BEGIN { exit !(t+0 >= min) }'; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload coverage report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage-report
        path: coverage.html

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      with:
        header: coverage
        message: |
          ### Code coverage: **${{ steps.coverage.outputs.total }}** ${{ steps.coverage.outputs.passed == 'true' && '✅' || '❌' }}
          Threshold: ${{ env.COVERAGE_THRESHOLD }}%. The full HTML report is in this run's artifacts.

    - name: Enforce coverage threshold
      if: steps.coverage.outputs.passed != 'true'
      run: |
        echo "Coverage ${{ steps.coverage.outputs.total }} is below ${COVERAGE_THRESHOLD}%"
        exit 1

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.27'

    - name: gosec
      shell: bash
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
        gosec ./...

    - name: govulncheck
      shell: bash
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
        govulncheck ./...
